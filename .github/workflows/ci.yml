name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check backend modules
        run: python -m py_compile $(find backend ingest -name "*.py")

  # Deployment itself is handled by DigitalOcean App Platform's native
  # GitHub integration (auto-deploy on push to main) -- no deploy step
  # needed here. See docs/architecture.md.
